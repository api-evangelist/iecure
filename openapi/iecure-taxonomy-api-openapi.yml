        description: Limit result set to terms with one or more specific slugs.
  /wp/v2/tags/{id}:
    get:
      operationId: getTag
      summary: getTag
      description: GET https://iecure.com/wp-json/wp/v2/tags/{id} - observed anonymously reachable on
        2026-08-22.
      tags:
      - taxonomy
      responses:
        '200':
          description: Success.
