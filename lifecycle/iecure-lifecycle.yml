source: openapi/ + live probes of https://iecure.com and its subdomains on 2026-08-22
note: >-
  iECURE runs no developer program, so it publishes no API versioning policy, no deprecation policy,
  no SLA and no status page. Nothing below is asserted on the company's behalf. No `StatusPage` and
  no `Deprecation` pointer is emitted in apis.yml, because neither exists — the operational
  transparency checks those pointers feed would be false credit here.
versioning:
  scheme: uri-path-namespace
  current: wp/v2
  docs: https://developer.wordpress.org/rest-api/
  provider_policy: null
  detail: >-
    The version lives in the route namespace and is set by WordPress core and the installed plugins,
    not by iECURE. Namespaces observed 2026-08-22: oembed/1.0, aioseo/v1, wp-umbrella/v1,
    duplicate-post/v1, wp-analytify/v1, regenerate-thumbnails/v1, wp/v2, wp-site-health/v1,
    wp-block-editor/v1, wp-abilities/v1. A plugin update can add, change or remove routes at any time
    with no notice to consumers — the wp-abilities/v1 namespace is itself a recent arrival.
