- status: 404
  code: rest_no_route
  title: No route matched
  detail: >-
    "No route was found matching the URL and request method." Note that this JSON error is produced
    only for paths under /wp-json/. A bad path elsewhere under the WordPress rewrite — for example
    /.well-known/agent-card.json — returns the Avada theme HTML 404 page instead.
  observed: 'GET /wp-json/wp/v2/nosuchroute -> {"code":"rest_no_route","message":"No route was found matching the URL and request method.","data":{"status":404}}'
edge_errors:
  note: >-
    Errors can also originate at the edge rather than the application, and do not use the WordPress
    envelope. Two layers sit in front of the origin: Cloudflare, then Kinsta.
  cases:
  - status: 404
    origin: WordPress / Avada theme
    body: 56,812 bytes of themed HTML
    detail: Returned for every /.well-known/* path and for unmatched site paths.
    remediation: Do not treat a 200-sized HTML body as a document; parse before trusting.
