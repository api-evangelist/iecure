method: derived
source: openapi/ + live anonymous error responses observed on https://iecure.com/wp-json 2026-08-22
format: wordpress-rest
rfc9457: false
note: >-
  iECURE publishes no error reference — it runs no developer program. This catalogue is derived from
  the WordPress REST error envelope and from error bodies actually observed on 2026-08-22. The
  envelope is `{code, message, data:{status, params?, details?}}` served as application/json. It is
  NOT RFC 9457 problem details: there is no `type` URI, no title/detail split and no
  application/problem+json media type, so no dereferenceable problem-type URIs exist for this
  provider and none are invented here. The `code` field is the stable machine-readable discriminator.
envelope:
  media_type: application/json
  fields:
    code: Machine-readable error code — the stable discriminator.
    message: Human-readable message, localized to the site language.
    data.status: The HTTP status code, repeated in the body.
    data.params: Per-parameter messages. Present only on rest_invalid_param.
    data.details: Per-parameter structured detail with its own nested code.
problems:
- status: 400
  code: rest_invalid_param
  title: Invalid parameter
  detail: One or more query parameters failed validation.
  observed: 'GET /wp/v2/posts?per_page=500 -> {"code":"rest_invalid_param","message":"Invalid parameter(s): per_page","data":{"status":400,"params":{"per_page":"per_page must be between 1 (inclusive) and 100 (inclusive)"},"details":{"per_page":{"code":"rest_out_of_bounds",...}}}}'
  remediation: Clamp per_page to 1..100 and re-send; read data.details[param].code for the specific rule.
  source_operations:
  - openapi/iecure-posts-api-openapi.yml#listPosts
  - openapi/iecure-pages-api-openapi.yml#listPages
  - openapi/iecure-media-api-openapi.yml#listMedia
  - openapi/iecure-team-api-openapi.yml#listTeamMembers
  - openapi/iecure-search-api-openapi.yml#searchContent
- status: 400
  code: rest_out_of_bounds
  title: Parameter out of bounds
  detail: Nested code inside data.details when a numeric parameter falls outside its allowed range.
  remediation: Respect the minimum/maximum declared for the parameter in the OpenAPI.
- status: 401
  code: rest_forbidden
  title: Authentication required
  detail: >-
    The generic WordPress permission denial. Returned anonymously for /wp/v2/settings, the whole
    wp-abilities/v1 namespace and the aioseo/v1 namespace.
  observed: 'GET /wp/v2/settings -> {"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
  remediation: >-
    Not remediable by a public consumer. These routes are administrative and require an
    authenticated WordPress user; they are excluded from the OpenAPI in this repo.
- status: 401
  code: rest_cannot_view_themes
