note: >-
  iECURE ships NO MCP server. Nothing here is a live agent surface, and NO `MCPServer` pointer is
  emitted in apis.yml — emitting one would credit the company with a server it does not run. This
  file exists to record two real findings and a derived candidate.
  FINDING 1: the deployment registers the WordPress Abilities API at /wp-abilities/v1 — the
  capability registry that WordPress MCP adapters read to expose site abilities as tools. It is
  present and it is CLOSED: /wp-abilities/v1/abilities and /wp-abilities/v1/categories both return
  401 rest_forbidden to an anonymous caller. So the MCP-adjacent plumbing is installed but nothing
  is exposed through it.
  FINDING 2: the All in One SEO plugin registers /aioseo/v1/ai-agents/install-mcp-adapter and
  /aioseo/v1/ai-agents/generate-app-password. These are administrative POST routes that would
  install an adapter for a logged-in site administrator; they are not a hosted MCP endpoint and they
  also return 401 anonymously. They are the plugin's feature, not iECURE's product.
  The tools below are a CANDIDATE derived from the anonymous read operations in openapi/. They
  describe what an MCP server over this surface COULD offer. No such server exists.
