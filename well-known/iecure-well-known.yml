note: >-
  iECURE publishes no /.well-known/ discovery documents. Every RFC 8615 path probed on 2026-08-22
  returned 404 — the WordPress rewrite answers them with the Avada theme 404 body (56,812 bytes of
  HTML), which is a genuine miss and not an SPA catch-all answering 200. Absence is recorded here as
  valid data, and NO `WellKnown` or `SecurityTxt` pointer is emitted in apis.yml, because emitting
  one would assert a surface the provider does not serve. No agent card was found at either the A2A
  1.0.0 canonical path or the pre-0.3 legacy path, so no a2a/ artifact is written for this provider.
  What iECURE DOES serve outside /.well-known/ is an /llms.txt — generated by the All in One SEO
  WordPress plugin rather than hand-authored — captured verbatim in llms/iecure-llms.txt.
