aid: iecure
name: iECURE
description: >-
  iECURE is a clinical-stage genetic medicines company developing variant-agnostic, in vivo targeted
  gene insertion therapies for rare, life-threatening inherited metabolic diseases, with an initial
  focus on urea cycle disorders and other neurometabolic conditions of the liver. The company takes
  its name from iecur, the Latin word for liver, and was founded on the translational gene therapy
  research of James M. Wilson, M.D., Ph.D., advancing its pipeline in partnership with the University
  of Pennsylvania Gene Therapy Program. Its lead candidate, ECUR-506, pairs a dual-AAV delivery
  approach with Precision BioSciences' ARCUS nuclease to insert a functional copy of the OTC gene into
  the genome of infants with neonatal-onset ornithine transcarbamylase deficiency; it is in the
  OTC-HOPE study and has received FDA Orphan Drug, Rare Pediatric Disease, Fast Track and RMAT
  designations plus EU orphan designation, with clinical trial clearances in the United States, United
  Kingdom, Australia and the EU. Discovery-stage programs target citrullinemia type 1 and
  phenylketonuria. iECURE has raised roughly $115 million across a $50 million Series A in 2021 and a
  $65 million Series A-1 in 2022 from Versant Ventures, OrbiMed, Novo Holdings, the Qatar Investment
  Authority, LYFE Capital and Double Point Ventures. iECURE runs no developer program and publishes no
  product API, developer portal or API documentation. The only machine-readable surface reachable
  without credentials is the WordPress REST content API behind iecure.com, catalogued here.
